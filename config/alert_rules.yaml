alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(latency_ms) > 3000ms
    duration: 5m
    type: symptom-based
    channel: slack
    owner: TranTuanTu-2A202602840
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2%
    duration: 2m
    type: symptom-based
    channel: slack
    owner: TranTuanTu-2A202602840
    runbook: docs/alerts.md#alert-2
  - name: LowRetrievalSuccess
    severity: warning
    condition: retrieval_success_rate_pct < 90%
    duration: 5m
    type: symptom-based
    channel: slack
    owner: TranTuanTu-2A202602840
    runbook: docs/alerts.md#alert-3
